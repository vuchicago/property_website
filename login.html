<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRM2FPST0T"></script>
        <script>
                window.dataLayer = window.dataLayer || [];
                function gtag() { dataLayer.push(arguments); }
                gtag('js', new Date());
                gtag('config', 'G-KRM2FPST0T');
        </script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Cook County Tax Compare</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
                rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <style>
                .auth-container {
                        min-height: 80vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: var(--space-8) var(--container-padding);
                }

                .auth-card {
                        background: var(--white);
                        padding: var(--space-8);
                        border-radius: var(--radius-lg);
                        box-shadow: var(--shadow-lg);
                        width: 100%;
                        max-width: 400px;
                        border: 1px solid var(--dark-200);
                }

                .auth-header {
                        text-align: center;
                        margin-bottom: var(--space-6);
                }

                .auth-header h1 {
                        font-size: var(--font-size-2xl);
                        color: var(--dark-900);
                        margin-bottom: var(--space-2);
                }

                .auth-form .form-group {
                        margin-bottom: var(--space-4);
                }

                .auth-form label {
                        display: block;
                        margin-bottom: var(--space-2);
                        color: var(--dark-700);
                        font-weight: 500;
                }

                .auth-form input {
                        width: 100%;
                        padding: var(--space-3);
                        border: 1px solid var(--dark-300);
                        border-radius: var(--radius-md);
                        font-family: inherit;
                }

                .auth-toggle {
                        text-align: center;
                        margin-top: var(--space-4);
                        font-size: var(--font-size-sm);
                }

                .auth-toggle a {
                        color: var(--primary);
                        text-decoration: none;
                        font-weight: 500;
                        cursor: pointer;
                }

                .error-message {
                        background-color: #fee2e2;
                        color: #b91c1c;
                        padding: var(--space-3);
                        border-radius: var(--radius-md);
                        margin-bottom: var(--space-4);
                        display: none;
                        font-size: var(--font-size-sm);
                }
        </style>
</head>

<body>
        <!-- Simple Nav -->
        <nav class="navbar">
                <div class="nav-container">
                        <a href="index.html" class="logo">
                                <div class="logo-icon">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M3 21H21M4 18H20M6 18V10M10 18V10M14 18V10M18 18V10M12 3L21 10H3L12 3Z"
                                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                        stroke-linejoin="round" />
                                        </svg>
                                </div>
                                <span>Cook County<br><span class="logo-accent">Tax Compare</span></span>
                        </a>
                        <a href="index.html" class="btn btn-secondary btn-sm">Back to Home</a>
                </div>
        </nav>

        <div class="auth-container">
                <div class="auth-card">
                        <div class="auth-header">
                                <h1 id="page-title">Welcome Back</h1>
                                <p id="page-subtitle">Sign in to your account</p>
                        </div>

                        <div id="error-alert" class="error-message"></div>

                        <form id="auth-form" class="auth-form">
                                <div class="form-group">
                                        <label for="email">Email Address</label>
                                        <input type="email" id="email" required placeholder="you@example.com">
                                </div>
                                <div class="form-group">
                                        <label for="password">Password</label>
                                        <input type="password" id="password" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                        </form>

                        <div class="auth-toggle">
                                <span id="toggle-text">Don't have an account?</span>
                                <a id="toggle-btn">Create one</a>
                        </div>
                </div>
        </div>

        <!-- Auth Logic Script -->
        <script type="module">
                import { loginUser, registerUser, initAuthUI } from './auth.js';

                // Initialize UI (for nav if we had full nav here, but we have simple nav)
                initAuthUI();

                const form = document.getElementById('auth-form');
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const toggleBtn = document.getElementById('toggle-btn');
                const pageTitle = document.getElementById('page-title');
                const pageSubtitle = document.getElementById('page-subtitle');
                const submitBtn = form.querySelector('button');
                const toggleText = document.getElementById('toggle-text');
                const errorAlert = document.getElementById('error-alert');

                let isLogin = true;

                toggleBtn.addEventListener('click', () => {
                        isLogin = !isLogin;
                        updateUI();
                });

                function updateUI() {
                        if (isLogin) {
                                pageTitle.textContent = 'Welcome Back';
                                pageSubtitle.textContent = 'Sign in to your account';
                                submitBtn.textContent = 'Sign In';
                                toggleText.textContent = "Don't have an account?";
                                toggleBtn.textContent = 'Create one';
                        } else {
                                pageTitle.textContent = 'Create Account';
                                pageSubtitle.textContent = 'Get started with Cook County Tax Compare';
                                submitBtn.textContent = 'Sign Up';
                                toggleText.textContent = "Already have an account?";
                                toggleBtn.textContent = 'Sign In';
                        }
                        errorAlert.style.display = 'none';
                }

                form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        errorAlert.style.display = 'none';
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Processing...';

                        const email = emailInput.value;
                        const password = passwordInput.value;

                        let result;
                        if (isLogin) {
                                result = await loginUser(email, password);
                        } else {
                                result = await registerUser(email, password);
                        }

                        if (result.success) {
                                // Redirect to home on success
                                window.location.href = 'index.html';
                        } else {
                                errorAlert.textContent = result.error;
                                errorAlert.style.display = 'block';
                                submitBtn.disabled = false;
                                submitBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
                        }
                });
        </script>
</body>

</html>
