# AI Sales avatar settings.

# English only. Browser speech recognition uses this locale.
language: en-US

# DeepSeek model for buyer/customer replies.
# Use deepseek/deepseek-v4-flash for lower latency, deepseek/deepseek-v4-pro for quality.
deepseekModelPro: deepseek/deepseek-v4-pro
deepseekModel: deepseek/deepseek-v4-flash

# Optional model for turn detection when local pause heuristics are not enough.
deepseekTurnModel: deepseek/deepseek-v4-flash

# Default browser text-to-speech profile. Try: britishMale, male, female.
preferredVoice: britishMale

# TTS provider for avatar speech. Use cloudflare for consistent audio across
# browsers; browser is the old local SpeechSynthesis fallback.
ttsProvider: cloudflare
ttsModel: "@cf/deepgram/aura-2-en"
ttsSpeaker: apollo

# Lower values make the avatar respond sooner; higher values make it wait longer.
doneProbability: 0.45

# Fast-path Auto mode pause timer for Chrome/Edge SpeechRecognition.
autoPauseMs: 250

# After a pause, respond locally without asking the turn model when the transcript
# has at least this many words and does not end with a continuation word.
autoLocalPauseMinWords: 2

# Fallback Auto mode recorder settings for browsers without SpeechRecognition.
autoRecorderSilenceMs: 350
autoRecorderMinSpeechMs: 350
autoRecorderMaxSegmentMs: 7000
autoRecorderRmsThreshold: 0.035

# Ignore mic input during avatar speech and briefly after, so speakers do not
# trigger self-interruption.
avatarEchoCooldownMs: 700
