<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Appeal Submitted - Cook County Tax Compare</title>
        <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
        <link rel="stylesheet" href="site-1.css?v=20260522">
    <link rel="stylesheet" href="site-2.css?v=20260522">
    <link rel="stylesheet" href="site-3.css?v=20260522">
    <link rel="stylesheet" href="site-4.css?v=20260522">
        <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
        <div class="container"
                style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
                <div id="status">
                        <h2>Checking payment status...</h2>
                </div>
        </div>

        <script type="module">
                import { auth } from './auth-client.js';

                document.addEventListener('DOMContentLoaded', async () => {
                        const statusDiv = document.getElementById('status');
                        const sessionId = new URLSearchParams(window.location.search).get('session_id');

                        if (!sessionId) {
                                statusDiv.innerText = 'Error: No session ID found.';
                                return;
                        }

                        try {
                                // 1. Verify Payment & Record in D1 (Backend)
                                let data = { status: 'unknown' };

                                if (sessionId.startsWith('mock_session_')) {
                                        // Mock verification for local testing
                                        data = {
                                                status: 'complete',
                                                payment_status: 'paid',
                                                metadata: { propertyAddress: '123 Mock St (Local Test)' },
                                                amount_total: 9900,
                                                db_status: 'mock_recorded'
                                        };
                                        // Simulate delay
                                        await new Promise(r => setTimeout(r, 800));
                                } else {
                                        // Real backend verification
                                        const res = await fetch(`/api/session-status?session_id=${sessionId}`);
                                        if (!res.ok) {
                                                throw new Error(`Verification API failed: ${res.status}`);
                                        }
                                        data = await res.json();
                                }

                                if (data.status === 'complete' || data.payment_status === 'paid') {

                                        const dbWarning = data.db_status && data.db_status.startsWith('error')
                                                ? `<p style="color: var(--error);">Payment succeeded, but saving the appeal failed: ${escapeHtml(data.db_status)}</p>`
                                                : '';

                                        statusDiv.innerHTML = `
        <h2 style="color: var(--success); margin-bottom: 1rem;">Payment Successful!</h2>
        <p class="lead">Your appeal for <strong>${data.metadata?.propertyAddress || 'your property'}</strong> has been
                submitted.</p>
        <p class="lead" style="font-size: 0.9em; color: #666;">Ref: ${sessionId}</p>
        ${dbWarning}
        <p>We have recorded your request and are processing it.</p>
        <div style="margin-top: 2rem;">
                <a href="login.html" class="btn btn-primary" style="margin-right: 1rem;">Go to Dashboard</a>
        </div>
        `;

                                } else {
                                        statusDiv.innerHTML = `<h2>Payment Incomplete</h2>
        <p>Status: ${data.status}</p>`;
                                }

                        } catch (err) {
                                console.error("Verification failed:", err);
                                statusDiv.innerText = 'An error occurred verifying your payment.';
                        }
                });

                function escapeHtml(value) {
                        return String(value ?? '')
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&#039;');
                }
        </script>
</body>

</html>
